<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 360" width="370" height="360">
  <defs>
    <linearGradient id="asciiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#111722" />
    </linearGradient>
    <filter id="asciiShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .window {
      fill: url(#asciiBg);
      stroke: #30363d;
      stroke-width: 1px;
      rx: 10px;
      ry: 10px;
    }
    .title-bar {
      fill: #161b22;
      stroke: #30363d;
      stroke-width: 1px;
    }
    .title-text {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 12px;
      font-weight: 600;
      fill: #c9d1d9;
    }
    .prompt-user { fill: #39d353; }
    .prompt-path { fill: #22d3ee; }
    .ascii-text {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 7.2px;
      fill: #39d353;
      white-space: pre;
    }
    .status-bar {
      fill: #161b22;
      stroke: #30363d;
      stroke-width: 1px;
    }
    .status-text {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 11px;
      fill: #c9d1d9;
    }
    .cursor {
      fill: #39d353;
      animation: blink 1s step-end infinite;
    }
    .ascii-row {
      opacity: 0;
      animation: revealRow 0.25s ease-out forwards;
    }
    @keyframes revealRow {
      0% {
        opacity: 0;
        transform: translateX(-4px);
      }
      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ascii-row {
        opacity: 1 !important;
        animation: none !important;
      }
      .cursor {
        animation: none !important;
        opacity: 1 !important;
      }
    }
  </style>

  <!-- Terminal Window -->
  <rect x="2" y="2" width="366" height="356" class="window" filter="url(#asciiShadow)" />

  <!-- Title Bar -->
  <path d="M 2 12 Q 2 2 12 2 L 358 2 Q 368 2 368 12 L 368 34 L 2 34 Z" class="title-bar" />

  <!-- Window Controls -->
  <circle cx="18" cy="18" r="5.5" fill="#ff5f56" />
  <circle cx="36" cy="18" r="5.5" fill="#ffbd2e" />
  <circle cx="54" cy="18" r="5.5" fill="#27c93f" />

  <!-- Window Title -->
  <text x="74" y="22" class="title-text">
    <tspan class="prompt-user">vkenned2@github</tspan>:<tspan class="prompt-path">~$</tspan> ./portrait.sh
  </text>

