<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 360" width="370" height="360">
  <defs>
    <linearGradient id="asciiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#111722" />
    </linearGradient>
    <filter id="asciiShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .window {
      fill: url(#asciiBg);
      stroke: #30363d;
      stroke-width: 1px;
      rx: 10px;
      ry: 10px;
    }
    .title-bar {
      fill: #161b22;
      stroke: #30363d;
      stroke-width: 1px;
    }
    .title-text {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 12px;
      font-weight: 600;
      fill: #c9d1d9;
    }
    .prompt-user { fill: #39d353; }
    .prompt-path { fill: #22d3ee; }
    .ascii-text {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 7.2px;
      fill: #39d353;
      white-space: pre;
    }
    .status-bar {
      fill: #161b22;
      stroke: #30363d;
      stroke-width: 1px;
    }
    .status-text {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 11px;
      fill: #c9d1d9;
    }
    .cursor {
      fill: #39d353;
      animation: blink 1s step-end infinite;
    }
    .ascii-row {
      opacity: 0;
      animation: revealRow 0.25s ease-out forwards;
    }
    @keyframes revealRow {
      0% {
        opacity: 0;
        transform: translateX(-4px);
      }
      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ascii-row {
        opacity: 1 !important;
        animation: none !important;
      }
      .cursor {
        animation: none !important;
        opacity: 1 !important;
      }
    }
  </style>

  <!-- Terminal Window -->
  <rect x="2" y="2" width="366" height="356" class="window" filter="url(#asciiShadow)" />

  <!-- Title Bar -->
  <path d="M 2 12 Q 2 2 12 2 L 358 2 Q 368 2 368 12 L 368 34 L 2 34 Z" class="title-bar" />

  <!-- Window Controls -->
  <circle cx="18" cy="18" r="5.5" fill="#ff5f56" />
  <circle cx="36" cy="18" r="5.5" fill="#ffbd2e" />
  <circle cx="54" cy="18" r="5.5" fill="#27c93f" />

  <!-- Window Title -->
  <text x="74" y="22" class="title-text">
    <tspan class="prompt-user">vkenned2@github</tspan>:<tspan class="prompt-path">~$</tspan> ./portrait.sh
  </text>

  <!-- ASCII Portrait Content -->
  <text x="16" y="54.0" class="ascii-text ascii-row" style="animation-delay: 0.05s;">       .-------------------------------------------.        </text>
  <text x="16" y="62.5" class="ascii-text ascii-row" style="animation-delay: 0.07s;">      /   _______________________________________   \       </text>
  <text x="16" y="71.0" class="ascii-text ascii-row" style="animation-delay: 0.09s;">     |   |                                       |   |      </text>
  <text x="16" y="79.5" class="ascii-text ascii-row" style="animation-delay: 0.11s;">     |   |    _____   _____     __  __ _  ___    |   |      </text>
  <text x="16" y="88.0" class="ascii-text ascii-row" style="animation-delay: 0.13s;">     |   |   /  _  \ /  _  \   |  |/  | |/   |   |   |      </text>
  <text x="16" y="96.5" class="ascii-text ascii-row" style="animation-delay: 0.15s;">     |   |   | |_| | | |_| |   |  '  /| ' /| |   |   |      </text>
  <text x="16" y="105.0" class="ascii-text ascii-row" style="animation-delay: 0.17s;">     |   |   |  _  | |  _  |   |    &lt; |  &lt; | |   |   |      </text>
  <text x="16" y="113.5" class="ascii-text ascii-row" style="animation-delay: 0.19s;">     |   |   |_| |_| |_| |_|   |__|\_\|__|\|_|   |   |      </text>
  <text x="16" y="122.0" class="ascii-text ascii-row" style="animation-delay: 0.21s;">     |   |                                       |   |      </text>
  <text x="16" y="130.5" class="ascii-text ascii-row" style="animation-delay: 0.23s;">     |   |        [ VISHAL KENNEDY PROFILE ]     |   |      </text>
  <text x="16" y="139.0" class="ascii-text ascii-row" style="animation-delay: 0.25s;">     |   |_______________________________________|   |      </text>
  <text x="16" y="147.5" class="ascii-text ascii-row" style="animation-delay: 0.27s;">      \_____________________________________________/       </text>
  <text x="16" y="156.0" class="ascii-text ascii-row" style="animation-delay: 0.29s;">                           |   |                            </text>
  <text x="16" y="164.5" class="ascii-text ascii-row" style="animation-delay: 0.31s;">                        .--;---;--.                         </text>
  <text x="16" y="173.0" class="ascii-text ascii-row" style="animation-delay: 0.33s;">                       /  [ONLINE] \                        </text>
  <text x="16" y="181.5" class="ascii-text ascii-row" style="animation-delay: 0.35s;">                      /  UTK ECOLOGY\                       </text>
  <text x="16" y="190.0" class="ascii-text ascii-row" style="animation-delay: 0.37s;">                     /  POLICY+DATA  \                      </text>
  <text x="16" y="198.5" class="ascii-text ascii-row" style="animation-delay: 0.39s;">                    '-----------------'                     </text>
  <text x="16" y="207.0" class="ascii-text ascii-row" style="animation-delay: 0.41s;">             .---------------------------------.            </text>
  <text x="16" y="215.5" class="ascii-text ascii-row" style="animation-delay: 0.43s;">             /  researcher @ energy + enviro    \           </text>
  <text x="16" y="224.0" class="ascii-text ascii-row" style="animation-delay: 0.45s;">            /   gis | spatial analysis | ai      \          </text>
  <text x="16" y="232.5" class="ascii-text ascii-row" style="animation-delay: 0.47s;">          '---------------------------------------'         </text>

  <!-- Bottom Status Bar -->
  <path d="M 2 332 L 368 332 L 368 348 Q 368 358 358 358 L 12 358 Q 2 358 2 348 Z" class="status-bar" />

  <text x="14" y="350" class="status-text">
    <tspan class="prompt-user">vkenned2@github</tspan>:<tspan class="prompt-path">~$</tspan> whoami <tspan fill="#e6edf3" font-weight="bold">Vishal Kennedy</tspan>
  </text>
  <rect x="272" y="339" width="7" height="13" class="cursor" />
</svg>